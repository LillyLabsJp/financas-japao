<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
html,body{margin:0;padding:0;}
body{width:1200px;height:420px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:linear-gradient(135deg,#0b3d59 0%,#072a3e 100%);position:relative;}
.badge{position:absolute;top:36px;left:70px;color:#7fe0b4;background:rgba(127,224,180,.12);border:1px solid rgba(127,224,180,.4);padding:6px 16px;border-radius:999px;font-size:18px;font-weight:600;}
h1{position:absolute;top:96px;left:70px;right:70px;color:#fff;font-size:52px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.1;}
h1 span{color:#7fe0b4;}
p{position:absolute;top:220px;left:70px;right:140px;color:#c9dbe4;font-size:24px;line-height:1.5;margin:0;}
.coins{position:absolute;top:330px;left:70px;color:#dfe9ef;font-size:18px;font-weight:600;display:flex;gap:22px;}
.coins span{opacity:.85;}
</style></head>
<body>
<div class="badge">Feito para brasileiros no Japão</div>
<h1>Finanças<span>Japão</span></h1>
<p>Calculadoras financeiras gratis: remessas, nenkin e furusato nozei</p>
<div class="coins"><span>Remessa Japão-Brasil</span><span>Nenkin</span><span>Furusato Nozei</span></div>
</body></html>
